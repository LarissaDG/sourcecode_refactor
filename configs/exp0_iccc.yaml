# ─────────────────────────────────────────────────────────
# EXP 0 — ICCC: replica a metodologia original do paper ICCC 2025
# Amostragem estratificada proporcional (proportional_stratified) → 502 imagens
# Sampling → Caption (Janus-7B) → Generate (Janus-1B + Janus-7B) → Score
# Gera outputs/exp0_iccc/sampling_bin_distribution.txt com a distribuição
# das imagens amostradas por bin de score estético.
# ─────────────────────────────────────────────────────────
experiment:
  name: "exp0_iccc"

dataset:
  name: apdd
  path: "/snfs1/speed/larissa.gomide/data/apddv2/"

pipeline:
  steps:
    sampling:   true
    captioning: true
    generation: true
    samples:    true
    scoring:    true

sampling:
  n_samples: 502
  strategy: "proportional_stratified"
  n_bins: 30

scoring:
  weights_dir: "/sonic_home/larissa.gomide/APDDv2/modle_weights/"
